<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="576" viewBox="0 0 1024 576">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1443e1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3478ff"/>
      <stop offset="50%" stop-color="#8ec0ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(52,120,255,0.04)" stroke-width="1"/>
    </pattern>
    <!-- Glow circle for decorative elements -->
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3478ff" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#3478ff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#3478ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="576" fill="#09090b"/>
  <rect width="1024" height="576" fill="url(#grid)"/>
  <rect width="1024" height="576" fill="url(#glow)"/>

  <!-- Decorative orbs -->
  <circle cx="180" cy="120" r="200" fill="url(#orbGlow)"/>
  <circle cx="850" cy="450" r="250" fill="url(#orbGlow)"/>

  <!-- Decorative floating dots -->
  <circle cx="120" cy="80" r="1.5" fill="#3478ff" opacity="0.5"/>
  <circle cx="250" cy="150" r="1" fill="#3478ff" opacity="0.3"/>
  <circle cx="890" cy="100" r="1.5" fill="#3478ff" opacity="0.4"/>
  <circle cx="780" cy="480" r="1" fill="#3478ff" opacity="0.3"/>
  <circle cx="950" cy="200" r="1.5" fill="#3478ff" opacity="0.25"/>
  <circle cx="70" cy="400" r="1" fill="#3478ff" opacity="0.35"/>
  <circle cx="500" cy="60" r="1.5" fill="#3478ff" opacity="0.2"/>
  <circle cx="600" cy="520" r="1" fill="#3478ff" opacity="0.3"/>

  <!-- Subtle decorative lines -->
  <line x1="0" y1="288" x2="140" y2="288" stroke="#3478ff" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="884" y1="288" x2="1024" y2="288" stroke="#3478ff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Main content group - centered -->
  <g transform="translate(512, 248)">
    <!-- Logo icon - pentagon/flow shape -->
    <g transform="translate(0, -40)">
      <!-- Abstract pentagon flow icon -->
      <path d="M-24,-28 L0,-38 L24,-28 L30,-4 L18,18 L0,26 L-18,18 L-30,-4 Z" 
            fill="none" stroke="#3478ff" stroke-width="1.5" opacity="0.3"/>
      <path d="M-16,-18 L0,-25 L16,-18 L20,-2 L12,12 L0,17 L-12,12 L-20,-2 Z" 
            fill="none" stroke="#3478ff" stroke-width="1.5" opacity="0.6"/>
      <circle cx="0" cy="-4" r="6" fill="#3478ff" opacity="0.8"/>
      <circle cx="0" cy="-4" r="3" fill="#8ec0ff"/>
    </g>

    <!-- Company name -->
    <text text-anchor="middle" y="30" font-family="Inter, sans-serif" font-weight="800" font-size="56" letter-spacing="-2">
      <tspan fill="#ffffff">Penta</tspan><tspan fill="#3478ff">Flow</tspan>
    </text>
    <text text-anchor="middle" y="54" font-family="Inter, sans-serif" font-weight="600" font-size="16" fill="#3478ff" letter-spacing="1" opacity="0.9">AI</text>

    <!-- Tagline -->
    <text text-anchor="middle" y="100" font-family="Inter, sans-serif" font-weight="400" font-size="20" fill="#9ca3af" letter-spacing="0.5">
      KI-Agenten für PSI Penta ERP
    </text>

    <!-- Separator line -->
    <line x1="-60" y1="120" x2="60" y2="120" stroke="#3478ff" stroke-opacity="0.3" stroke-width="1"/>

    <!-- Locations -->
    <text text-anchor="middle" y="150" font-family="Inter, sans-serif" font-weight="500" font-size="14" fill="#6b7280" letter-spacing="3">
      BERLIN  ·  WIEN
    </text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="572" width="1024" height="4" fill="#3478ff" opacity="0.6"/>
</svg>