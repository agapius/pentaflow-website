<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#142057" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#599eff"/>
      <stop offset="100%" stop-color="#3478ff"/>
    </linearGradient>
    <linearGradient id="iconGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ec0ff"/>
      <stop offset="100%" stop-color="#599eff"/>
    </linearGradient>
    <!-- Grid pattern -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(52,120,255,0.03)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="720" height="720" rx="80" fill="#09090b"/>
  <rect width="720" height="720" rx="80" fill="url(#grid)"/>
  <rect width="720" height="720" rx="80" fill="url(#bgGlow)"/>

  <!-- Decorative outer ring -->
  <circle cx="360" cy="310" r="200" fill="none" stroke="#3478ff" stroke-opacity="0.05" stroke-width="1"/>
  <circle cx="360" cy="310" r="160" fill="none" stroke="#3478ff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Main icon - abstract pentagon/flow mark -->
  <g transform="translate(360, 280)">
    <!-- Outer pentagon shape -->
    <path d="M0,-110 L105,-34 L65,89 L-65,89 L-105,-34 Z" 
          fill="none" stroke="#3478ff" stroke-width="2" opacity="0.15"/>
    
    <!-- Middle pentagon shape -->
    <path d="M0,-80 L76,-25 L47,65 L-47,65 L-76,-25 Z" 
          fill="none" stroke="#3478ff" stroke-width="2" opacity="0.3"/>

    <!-- Inner pentagon - filled -->
    <path d="M0,-52 L49,-16 L31,42 L-31,42 L-49,-16 Z" 
          fill="#3478ff" opacity="0.12"/>
    <path d="M0,-52 L49,-16 L31,42 L-31,42 L-49,-16 Z" 
          fill="none" stroke="url(#iconGrad)" stroke-width="2.5"/>

    <!-- Flow lines inside -->
    <path d="M-20,-20 Q0,-35 20,-20" fill="none" stroke="url(#iconGradLight)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-25,0 Q0,-18 25,0" fill="none" stroke="url(#iconGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M-18,18 Q0,5 18,18" fill="none" stroke="url(#iconGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Center dot -->
    <circle cx="0" cy="-8" r="5" fill="#8ec0ff"/>
    <circle cx="0" cy="-8" r="8" fill="#3478ff" opacity="0.3"/>
  </g>

  <!-- Company name -->
  <text text-anchor="middle" x="360" y="460" font-family="Inter, sans-serif" font-weight="800" font-size="72" letter-spacing="-2">
    <tspan fill="#ffffff">Penta</tspan><tspan fill="#3478ff">Flow</tspan>
  </text>

  <!-- AI badge -->
  <text text-anchor="middle" x="360" y="500" font-family="Inter, sans-serif" font-weight="700" font-size="24" fill="#3478ff" letter-spacing="6" opacity="0.85">AI</text>

  <!-- Tagline -->
  <text text-anchor="middle" x="360" y="565" font-family="Inter, sans-serif" font-weight="400" font-size="20" fill="#6b7280" letter-spacing="1">
    KI-Agenten für PSI Penta ERP
  </text>

  <!-- Bottom accent -->
  <line x1="280" y1="600" x2="440" y2="600" stroke="#3478ff" stroke-opacity="0.2" stroke-width="1"/>
</svg>